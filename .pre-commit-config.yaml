repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pytest
        name: Run tests for changed files + contract tests (pre-push)
        entry: >-
          bash -c '
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD);
          if [ "$CURRENT_BRANCH" = "main" ]; then
            echo "On main — running full suite.";
            pytest -m "not gpu";
          else
            if git rev-parse "@{u}" >/dev/null 2>&1; then
              BASE=$(git rev-parse "@{u}");
            else
              BASE=$(git merge-base main HEAD);
            fi;
            CHANGED=$(git diff --name-only "$BASE" HEAD -- "app/*.py");
            TEST_FILES="";
            for f in $CHANGED; do
              rel="${f#app/}";
              candidate="tests/$(dirname "$rel")/test_$(basename "$rel")";
              [ -f "$candidate" ] && TEST_FILES="$TEST_FILES $candidate";
            done;
            [ -n "$TEST_FILES" ] && pytest -m "not gpu" $TEST_FILES;
            pytest -m contract;
          fi
          '
        language: system
        pass_filenames: false
        stages: [pre-push]
        verbose: true
