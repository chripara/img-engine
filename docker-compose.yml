services:
  img-engine:
    build: .
    image: img-engine:latest
    ports:
      - "5000:5000"
      - "7860:7860"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./local_models:/app/local_models
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama

volumes:
  hf-cache:
  ollama-data:
